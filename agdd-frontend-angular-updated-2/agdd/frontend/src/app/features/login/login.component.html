<div class="login-page">
  <div class="login-panel-left">
    <div class="brand">
      <mat-icon class="brand-icon">precision_manufacturing</mat-icon>
      <h1>AGDD</h1>
      <p>Automated Gear Defect Detection</p>
    </div>
    <p class="tagline">Intelligent industrial quality control platform — Computer vision, robotics and digital twin.</p>
  </div>

  <div class="login-panel-right">
    <mat-card class="login-card agdd-fade-in">
      <h2>Sign In</h2>
      <p class="subtitle">Access your dashboard</p>

      <form [formGroup]="form" (ngSubmit)="onSubmit()">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Username</mat-label>
          <input matInput formControlName="username" autocomplete="username">
          <mat-icon matSuffix>person</mat-icon>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Password</mat-label>
          <input matInput [type]="hidePassword() ? 'password' : 'text'" formControlName="password" autocomplete="current-password">
          <button mat-icon-button matSuffix type="button" (click)="togglePassword()">
            <mat-icon>{{ hidePassword() ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
        </mat-form-field>

        @if (errorMessage()) {
          <p class="error-text">{{ errorMessage() }}</p>
        }

        <button mat-flat-button color="primary" class="full-width login-btn" type="submit" [disabled]="loading()">
          @if (loading()) {
            <mat-spinner diameter="20" style="display:inline-block; margin-right:8px;"></mat-spinner>
          }
          Sign In
        </button>

        <p class="signup-hint">
          Don't have an account?
          <a routerLink="/register">Create one</a>
        </p>
      </form>
    </mat-card>
  </div>
</div>
